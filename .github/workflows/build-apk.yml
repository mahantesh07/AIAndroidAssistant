name: Build AI Android Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project from this single workflow file
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/aiassistant
          mkdir -p app/src/main/res/xml
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AIAndroidAssistant'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.aiassistant'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.aiassistant'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:allowBackup="false"
                  android:label="AI Android Assistant"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AccessibilityController"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="AI Assistant Accessibility">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/xml/accessibility_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100" />
          XML

          cat > app/src/main/java/com/example/aiassistant/AccessibilityController.java <<'JAVA'
          package com.example.aiassistant;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.List;

          public class AccessibilityController extends AccessibilityService {
              private static AccessibilityController instance;
              public static AccessibilityController getInstance() { return instance; }

              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }
              @Override public void onAccessibilityEvent(AccessibilityEvent event) { }
              @Override public void onInterrupt() { instance = null; }

              public boolean clickElement(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  List<AccessibilityNodeInfo> nodes = root.findAccessibilityNodeInfosByText(text);
                  if (nodes == null) return false;
                  for (AccessibilityNodeInfo node : nodes) {
                      AccessibilityNodeInfo current = node;
                      while (current != null) {
                          if (current.isClickable())
                              return current.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          current = current.getParent();
                      }
                  }
                  return false;
              }
              public void goBack() { performGlobalAction(GLOBAL_ACTION_BACK); }
          }
          JAVA

          cat > app/src/main/java/com/example/aiassistant/MainActivity.java <<'JAVA'
          package com.example.aiassistant;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private LinearLayout messages;
              private EditText input;
              private TextToSpeech tts;
              private static final int AUDIO_PERMISSION = 41;
              private static final int SPEECH_REQUEST = 42;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) tts.setLanguage(Locale.getDefault());
                  });
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 32, 24, 20);
                  root.setBackgroundColor(0xFFF5F7FB);
                  TextView title = new TextView(this);
                  title.setText("AI Android Assistant");
                  title.setTextSize(24);
                  title.setTextColor(0xFF18243A);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);
                  TextView sub = new TextView(this);
                  sub.setText("Voice + text • Basic screen actions");
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0, 8, 0, 16);
                  root.addView(sub);
                  ScrollView scroll = new ScrollView(this);
                  messages = new LinearLayout(this);
                  messages.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(messages);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  input = new EditText(this);
                  input.setSingleLine(true);
                  input.setHint("Try: tap Settings or back");
                  root.addView(input);
                  LinearLayout row = new LinearLayout(this);
                  Button send = new Button(this); send.setText("Send");
                  Button voice = new Button(this); voice.setText("Speak");
                  Button enable = new Button(this); enable.setText("Enable control");
                  row.addView(send, new LinearLayout.LayoutParams(0, -2, 1));
                  row.addView(voice, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(row);
                  root.addView(enable);
                  send.setOnClickListener(v -> handle(input.getText().toString()));
                  voice.setOnClickListener(v -> startVoice());
                  enable.setOnClickListener(v -> startActivity(new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  setContentView(root);
                  addMessage("Assistant", "Ready. Enable the accessibility service to try basic commands. This starter build does not yet include AI vision or general-purpose AI planning.");
              }

              private void addMessage(String who, String message) {
                  TextView item = new TextView(this);
                  item.setText(who + ": " + message);
                  item.setTextSize(16);
                  item.setTextColor(0xFF18243A);
                  item.setPadding(12, 10, 12, 10);
                  messages.addView(item);
              }

              private void handle(String command) {
                  if (command == null || command.trim().isEmpty()) return;
                  addMessage("You", command);
                  input.setText("");
                  String c = command.trim();
                  String lower = c.toLowerCase(Locale.ROOT);
                  String response;
                  AccessibilityController service = AccessibilityController.getInstance();
                  if (lower.equals("back") || lower.equals("go back")) {
                      if (service != null) { service.goBack(); response = "Going back."; }
                      else response = "Enable AI Assistant Accessibility first.";
                  } else if (lower.startsWith("tap ")) {
                      String target = c.substring(4).trim();
                      response = service != null && service.clickElement(target)
                          ? "Tapped " + target + "."
                          : "Could not find a clickable element named " + target + ". Check accessibility permission and the current screen.";
                  } else {
                      response = "Try 'back' or 'tap [visible text]'. AI screen understanding will be added in a later version.";
                  }
                  addMessage("Assistant", response);
                  if (tts != null) tts.speak(response, TextToSpeech.QUEUE_FLUSH, null, "assistant_reply");
              }

              private void startVoice() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      addMessage("Assistant", "Speech recognition is not available on this device.");
                      return;
                  }
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                  startActivityForResult(intent, SPEECH_REQUEST);
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == SPEECH_REQUEST && result == RESULT_OK && data != null) {
                      ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (matches != null && !matches.isEmpty()) handle(matches.get(0));
                  }
              }

              @Override protected void onDestroy() {
                  if (tts != null) tts.shutdown();
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAndroidAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
